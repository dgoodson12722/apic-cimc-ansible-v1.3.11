---
# Checks APIC cluster health over the REST API (HTTPS only -- no SSH/CLI
# access required). Defaults to the current host's own ansible_host; pass
# target_apic_host / target_apic_name to check a different APIC, e.g. from
# within a play whose hosts are the cimc group.
- name: Set target APIC for this cluster check
  ansible.builtin.set_fact:
    _apic_check_host: "{{ target_apic_host | default(ansible_host) }}"
    _apic_check_name: "{{ target_apic_name | default(inventory_hostname) }}"

- name: Log in to APIC REST API
  ansible.builtin.uri:
    url: "https://{{ _apic_check_host }}/api/aaaLogin.json"
    method: POST
    body_format: json
    body:
      aaaUser:
        attributes:
          name: "{{ apic_username }}"
          pwd: "{{ apic_password }}"
    validate_certs: "{{ apic_validate_certs }}"
    status_code: 200
    timeout: "{{ apic_request_timeout }}"
  register: apic_login_result
  delegate_to: localhost
  no_log: true

- name: Extract APIC auth token
  ansible.builtin.set_fact:
    _apic_token: "{{ apic_login_result.json.imdata[0].aaaLogin.attributes.token }}"
  no_log: true

- name: Query APIC appliance-vector cluster health
  ansible.builtin.uri:
    url: "https://{{ _apic_check_host }}/api/class/infraWiNode.json"
    method: GET
    headers:
      Cookie: "APIC-cookie={{ _apic_token }}"
    validate_certs: "{{ apic_validate_certs }}"
    status_code: 200
    timeout: "{{ apic_request_timeout }}"
  register: apic_cluster_query
  delegate_to: localhost
  no_log: true

- name: Log out of APIC REST API
  ansible.builtin.uri:
    url: "https://{{ _apic_check_host }}/api/aaaLogout.json"
    method: POST
    body_format: json
    body:
      aaaUser:
        attributes:
          name: "{{ apic_username }}"
    headers:
      Cookie: "APIC-cookie={{ _apic_token }}"
    validate_certs: "{{ apic_validate_certs }}"
    status_code: 200
    timeout: "{{ apic_request_timeout }}"
  delegate_to: localhost
  no_log: true
  failed_when: false

- name: Validate cluster query returned data
  ansible.builtin.assert:
    that:
      - apic_cluster_query.json.imdata is defined
      - apic_cluster_query.json.imdata | length > 0
    fail_msg: >-
      APIC returned an empty or invalid infraWiNode response for
      {{ _apic_check_name }}.

- name: Store cluster node details
  ansible.builtin.set_fact:
    apic_cluster_nodes: >-
      {{
        apic_cluster_query.json.imdata
        | map(attribute='infraWiNode.attributes')
        | list
      }}

- name: Store cluster node health values
  ansible.builtin.set_fact:
    apic_cluster_output: >-
      {{
        apic_cluster_nodes
        | map(attribute='health')
        | list
      }}

- name: Validate fully-fit controllers
  ansible.builtin.assert:
    that:
      - (apic_cluster_output | select('match', apic_cluster_health_pattern) | list | length) >= (apic_expected_active_controllers | int)
    fail_msg: >-
      Expected at least {{ apic_expected_active_controllers }} fully-fit
      controller entries for {{ _apic_check_name }}. Review the infraWiNode
      query results below.
  when: apic_expected_active_controllers | int > 0

- name: Display APIC cluster summary
  ansible.builtin.debug:
    msg: >-
      {{ _apic_check_name }} cluster: {{ apic_cluster_nodes | length }} node(s)
      reported, {{ apic_cluster_output | select('match', apic_cluster_health_pattern) | list | length }}
      fully-fit.

- name: Display full APIC cluster node details
  ansible.builtin.debug:
    var: item
  loop: "{{ apic_cluster_nodes }}"
  loop_control:
    label: "{{ item.nodeName | default(item.id | default('node')) }}"

- name: Build APIC cluster report
  ansible.builtin.set_fact:
    apic_cluster_report:
      apic: "{{ _apic_check_name }}"
      checked_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      expected_active_controllers: "{{ apic_expected_active_controllers | int }}"
      fully_fit_count: "{{ apic_cluster_output | select('match', apic_cluster_health_pattern) | list | length }}"
      nodes: "{{ apic_cluster_nodes }}"

- name: Show where the APIC cluster report will be written
  ansible.builtin.debug:
    msg: "Report directory: {{ report_directory | realpath }}"
  delegate_to: localhost
  run_once: true

- name: Ensure local report directory exists
  ansible.builtin.file:
    path: "{{ report_directory }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  run_once: true

- name: Write APIC cluster report
  ansible.builtin.copy:
    content: "{{ apic_cluster_report | to_nice_json }}
"
    dest: "{{ report_directory }}/{{ _apic_check_name }}-{{ apic_report_label | default('cluster') }}.json"
    mode: "0600"
  delegate_to: localhost

- name: Show APIC cluster report file written
  ansible.builtin.debug:
    msg: >-
      Report file: {{ report_directory | realpath }}/{{ _apic_check_name }}-{{ apic_report_label | default('cluster') }}.json
  delegate_to: localhost
